name: syzkaller fuzzing CI

env:
  FUZZ_SECONDS: "120" #18000 = 5jam

on:
  workflow_dispatch:
  push:
    branches: [jin-fuzz-ci]
    paths:
      - ".github/workflows/fuzzing.yml"
      - "myfuzzing/syz/syz-qemu.json"
      - "myfuzzing/syz/initramfs-new.cpio.gz"
  schedule:
    - cron: "0 */6 * * *"   # opsional, jaring pengaman kalau rantai putus

concurrency:
  group: syz-fuzz-loop
  cancel-in-progress: false # jangan batalkan jika masih run, misal saat commit>

permissions:
  contents: read
  actions: write




jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # paksa berhenti sebelum 6 jam

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qemu-kvm \
            gettext libelf-dev \
            qemu-system-x86 busybox-static cpio \
            git ssh openssh-client curl jq

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Linux OEM 6.0 source
        run: |
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0.orig.tar.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.diff.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.dsc

          dpkg-source -x linux-oem-6.0_6.0.0-1021.21.dsc

          mkdir -p /home/runner/work/test-ci/test-ci
          mv linux-oem-6.0-6.0.0 /home/runner/work/test-ci/test-ci

      - name: Download kernel-6 release
        run: |
          wget https://github.com/SunJangYo12/test-ci/releases/download/kcov-6.0.9-run225/linux-oem-6-kcov.tar.gz

          tar -xf linux-oem-6-kcov.tar.gz
          ls
          echo "zzzzzzzzzzz"
          mv release/* /home/runner/work/test-ci/test-ci/linux-oem-6.0-6.0.0


      - name: Download syzkaller release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            -R sunjangyo12/syzkaller \
            -p "host-amd64_target_amd64.tar.gz"

          tar -xf host-amd64_target_amd64.tar.gz


      - name: Buka tunnel ke web UI
        env:
          ZZ: "8998193648:AAFmoLWOwsYwvcmGmDVr6m6iFjD1hJ49Chc" # simpan ini BAHAYA
          CHAT_ID: "7797309176"

        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:56741 > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="Syzkaller UI: $URL"
          else
            MSG="GAGAL Syzkaller publik url"
          fi

          curl -s "https://api.telegram.org/bot$ZZ/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null



      - name: Ambil state sesi sebelumnya
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=fuzz-state&per_page=5" \
                 -q '[.artifacts[] | select(.expired==false)][0].id')
          if [ -n "$ID" ] && [ "$ID" != "null" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ID/zip" > prev.zip
            mkdir -p prev && unzip -q prev.zip -d prev
            ls -R prev | head -20
          else
            echo "Tidak ada state lama, mulai dari nol"
          fi



      - name: Run Fuzzer syzkaler
        env:
          ZZ: "8998193648:AAFmoLWOwsYwvcmGmDVr6m6iFjD1hJ49Chc" # simpan ini BAHAYA
          CHAT_ID: "7797309176"
          DURATION: ${{ inputs.seconds || '60' }}

        run: |
          set -o pipefail
          {
            chmod +x myfuzzing/bot.sh
            nohup myfuzzing/bot.sh "$ZZ" "$CHAT_ID" > ~/bot.log 2>&1 &

            cd myfuzzing/syz
            chmod 0600 ssh/mykey
            mkdir -p workdir

            # lanjutkan corpus dari sesi sebelumnya
            if [ -d "$GITHUB_WORKSPACE/prev/workdir" ]; then
              cp -a "$GITHUB_WORKSPACE/prev/workdir/." workdir/
            fi

            timeout -s INT -k 2m "${FUZZ_SECONDS}s" \
              /home/runner/work/syzkaller/syzkaller/bin/syz-manager \
              -config=syz-qemu.json || true

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p output/workdir

          cp ~/mylog.txt output/ || true
          cp ~/bot.log output/ || true
          cp -a myfuzzing/syz/workdir/. output/ || true


      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-state
          path: output
          retention-days: 7

      - name: Lanjutkan sesi berikutnya
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "${{ github.workflow }}" --ref ${{ github.ref_name }}
