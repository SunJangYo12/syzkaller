name: syzkaller fuzzing CI

on:
  push:
    branches: [jin-fuzz-ci]
  pull_request:
    branches: [jin-fuzz-ci]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qemu-kvm \
            gettext libelf-dev \
            qemu-system-x86 busybox-static cpio \
            git ssh openssh-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            -R sunjangyo12/syzkaller \
            -p "host-amd64_target_amd64.tar.gz"

          tar -xf host-amd64_target_amd64.tar.gz

      - name: Run Fuzzer
        run: |
          set -o pipefail
          {
            cd myfuzzing/syz
            chmod 0600 ssh/mykey
            timeout -s INT -k 2m 30s \
                /home/runner/work/syzkaller/syzkaller/bin/syz-manager \
                -config=syz-qemu.json -debug

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz

