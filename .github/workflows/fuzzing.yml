name: syzkaller fuzzing CI

on:
  push:
    branches: [jin-fuzz-ci]
  pull_request:
    branches: [jin-fuzz-ci]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qemu-kvm \
            gettext libelf-dev \
            qemu-system-x86 busybox-static cpio \
            git ssh openssh-client curl jq

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download Linux OEM 6.0 source
        run: |
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0.orig.tar.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.diff.gz
          wget https://security.ubuntu.com/ubuntu/ubuntu/pool/main/l/linux-oem-6.0/linux-oem-6.0_6.0.0-1021.21.dsc

          dpkg-source -x linux-oem-6.0_6.0.0-1021.21.dsc
          mv linux-oem-6.0-6.0.0 linux-6-source


      - name: Download kernel-6 release
        run: |
          wget https://github.com/SunJangYo12/test-ci/releases/download/kcov-6.0.9-run224/linux-oem-6-kcov.tar.gz

          tar -xf linux-oem-6-kcov.tar.gz
          ls
          echo "zzzzzzzzzzz"
          mv release/* linux-6-source


      - name: Download syzkaller release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            -R sunjangyo12/syzkaller \
            -p "host-amd64_target_amd64.tar.gz"

          tar -xf host-amd64_target_amd64.tar.gz


      - name: Buka tunnel ke web UI
        env:
          ZZ: "8998193648:AAFmoLWOwsYwvcmGmDVr6m6iFjD1hJ49Chc" # simpan ini BAHAYA
          CHAT_ID: "7797309176"

        run: |
          curl -L -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:56741 > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -n "$URL" ]; then
            MSG="Syzkaller UI: $URL"
          else
            MSG="GAGAL Syzkaller publik url"
          fi

          curl -s "https://api.telegram.org/bot$ZZ/sendMessage" \
            -d chat_id="$CHAT_ID" --data-urlencode text="$MSG" > /dev/null



      - name: Run Fuzzer syzkaler
        run: |
          set -o pipefail
          {
            cd myfuzzing/syz
            chmod 0600 ssh/mykey

            FUZZDATA="workdir/fuzzdata"

            # collector: salin corpus dan ambil coverage tiap 15 menit
            (
              while true; do
                #sleep 900
                sleep 1

                ts=$(date +%H%M%S)
                mkdir -p "$FUZZDATA/percov-$ts"

                curl -s http://127.0.0.1:56741/rawcover > "$FUZZDATA/rawcover-$ts.txt" || true

                curl -s http://127.0.0.1:56741/corpus | grep -o 'input?sig=[0-9a-f]*' | cut -d= -f2 | sort -u > "$FUZZDATA/sigs-$ts.txt" || true

                while read sig; do
                  curl -s "http://$HOST/rawcover?input=$sig" > "$FUZZDATA/percov-$ts/$sig.pcs" || true
                done < "$FUZZDATA/sigs-$ts.txt"

              done
            ) &
            COLLECTOR=$!

            timeout -s INT -k 2m 1m \
                /home/runner/work/syzkaller/syzkaller/bin/syz-manager \
                -config=syz-qemu.json || true

            kill $COLLECTOR 2>/dev/null || true

            cp -R workdir ~

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/
          cp -R ~/workdir output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz

