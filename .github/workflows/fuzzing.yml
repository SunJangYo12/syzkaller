name: syzkaller fuzzing CI

on:
  push:
    branches: [jin-fuzz-ci]
  pull_request:
    branches: [jin-fuzz-ci]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qemu-kvm \
            gettext libelf-dev \
            qemu-system-x86 busybox-static cpio \
            git ssh openssh-client curl

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm


      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 \
            -R sunjangyo12/syzkaller \
            -p "host-amd64_target_amd64.tar.gz"

          tar -xf host-amd64_target_amd64.tar.gz

      - name: Run Fuzzer
        run: |
          set -o pipefail
          {
            cd myfuzzing/syz
            chmod 0600 ssh/mykey

            FUZZDATA="workdir/fuzzdata"

            # collector: salin corpus dan ambil coverage tiap 15 menit
            (
              while true; do
                #sleep 900
                sleep 1

                ts=$(date +%H%M%S)
                mkdir -p "$FUZZDATA/percov-$ts"

                echo "ZZZZZZzzzzzzzzz: $ts"

                curl -s http://127.0.0.1:56741/rawcover > "$FUZZDATA/rawcover-$ts.txt" || true

                curl -s http://127.0.0.1:56741/corpus | grep -o 'input?sig=[0-9a-f]*' | cut -d= -f2 | sort -u > "$FUZZDATA/sigs.txt"

                while read sig; do
                  curl -s "http://$HOST/rawcover?input=$sig" > "$FUZZDATA/percov-$ts/$sig.pcs"
                  COV=`cat $FUZZDATA/$sig.pcs | wc -l`

                  echo "[+] COV=$COV $sig"
                done < "$FUZZDATA/sigs.txt"

              done
            ) &
            COLLECTOR=$!

            timeout -s INT -k 2m 4m \
                /home/runner/work/syzkaller/syzkaller/bin/syz-manager \
                -config=syz-qemu.json || true

            kill $COLLECTOR 2>/dev/null || true

            cp -R workdir ~

          } 2>&1 | tee -a ~/mylog.txt


      - name: Collect artifacts
        run: |
          mkdir -p output

          cp ~/mylog.txt output/
          cp -R ~/workdir output/

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz

