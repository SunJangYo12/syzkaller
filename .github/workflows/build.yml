name: syzkaller build

on:
  push:
    branches: [jin-net]
  pull_request:
    branches: [jin-net]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils

      - name: Configure go
        run: |
          set -o pipefail
          {
            wget https://dl.google.com/go/go1.26.0.linux-amd64.tar.gz
            tar -xf go1.26.0.linux-amd64.tar.gz

          } 2>&1 | tee -a mylog.txt

      - name: Make syzkaller
        run: |
          set -o pipefail

          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"

          {
            make -j$(nproc)
            make bin/syz-extract

          } 2>&1 | tee -a mylog.txt

      - name: Clone Linux 5.15
        run: |
          git clone \
            --depth=1 \
            --branch v5.15.190 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            linux

      - name: Configure kernel
        run: |
          cd linux
          ./scripts/config \
              -e EARLY_PRINTK \
              -e 64BIT \
              -e BPF -d EMBEDDED -d EXPERT \
              -e INOTIFY_USER \
              -e ACPI \
              -e BLK_DEV_INITRD \
              -e SYSVIPC \
              -e CC_OPTIMIZE_FOR_PERFORMANCE \
              -d CC_OPTIMIZE_FOR_SIZE

          ./scripts/config \
              -e KCOV \
              -d KCOV_INSTRUMENT_ALL \
              -e KCOV_ENABLE_COMPARISONS

          find net -name Makefile \
              | xargs -L1 -I {} bash -c 'echo "KCOV_INSTRUMENT := y" >> {}'

          ./scripts/config \
              -e DEBUG_FS -e DEBUG_INFO \
              -e KALLSYMS -e KALLSYMS_ALL \
              -e NAMESPACES -e UTS_NS -e IPC_NS -e PID_NS -e NET_NS -e USER_NS \
              -e CGROUP_PIDS -e MEMCG -e CONFIGFS_FS -e SECURITYFS \
              -e KASAN -e KASAN_INLINE -e WARNING \
              -e FAULT_INJECTION -e FAULT_INJECTION_DEBUG_FS \
              -e FAILSLAB -e FAIL_PAGE_ALLOC \
              -e FAIL_MAKE_REQUEST -e FAIL_IO_TIMEOUT -e FAIL_FUTEX \
              -e LOCKDEP -e PROVE_LOCKING \
              -e DEBUG_ATOMIC_SLEEP \
              -e PROVE_RCU -e DEBUG_VM \
              -e REFCOUNT_FULL -e FORTIFY_SOURCE \
              -e HARDENED_USERCOPY -e LOCKUP_DETECTOR \
              -e SOFTLOCKUP_DETECTOR -e HARDLOCKUP_DETECTOR \
              -e BOOTPARAM_HARDLOCKUP_PANIC \
              -e DETECT_HUNG_TASK -e WQ_WATCHDOG \
              --set-val DEFAULT_HUNG_TASK_TIMEOUT 140 \
              --set-val RCU_CPU_STALL_TIMEOUT 100 \
              -e UBSAN \
              -d RANDOMIZE_BASE

          ./scripts/config \
              -e VIRTIO -e VIRTIO_PCI -e VIRTIO_MMIO \
              -e NET -e NET_CORE -e NETDEVICES -e NETWORK_FILESYSTEMS \
              -e INET -e NET_9P -e NET_9P_VIRTIO -e 9P_FS \
              -e VIRTIO_NET -e VIRTIO_CONSOLE \
              -e DEVTMPFS -e SCSI_VIRTIO -e BINFMT_SCRIPT -e TMPFS \
              -e UNIX -e TTY -e VT -e UNIX98_PTYS -e WATCHDOG -e WATCHDOG_CORE \
              -e I6300ESB_WDT \
              -e BLOCK -e SCSI_gLOWLEVEL -e SCSI -e SCSI_VIRTIO \
              -e BLK_DEV_SD -e VIRTIO_BALLOON \
              -d CMDLINE_OVERRIDE \
              -d UEVENT_HELPER \
              -d EMBEDDED -d EXPERT \
              -d MODULE_SIG_FORCE

          ./scripts/config -e PACKET \
              -e INET_UDP_DIAG -e INET_RAW_DIAG -e INET_DIAG_DESTROY \
              -e NETLINK_DIAG -e UNIX_DIAG -e BPF_SYSCALL \
              -e VSOCKETS -e NLMON -e DUMMY -e TLS

          make olddefconfig


      - name: Generate file const
        run: |
          set -o pipefail
          {
            ./bin/syz-extract -os linux -arch amd64 \
                -sourcedir linux/ \
                -config ./sys/linux/vnet_myproto.txt

            echo "menghasilkan sys/linux/vnet_myproto_amd64.const"

          } 2>&1 | tee -a mylog.txt

      - name: Generate
        run: |
          set -o pipefail
          {
            make generate

          } 2>&1 | tee -a mylog.txt


      - name: Rebuild syzkaller
        run: |
          set -o pipefail

          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"
          {
            make -j$(nproc)

          } 2>&1 | tee -a mylog.txt




      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/

          cp -R ./bin output/ 2>/dev/null || true
          cp -R ./sys output/ 2>/dev/null || true

          echo "=== Artifact contents ==="
          ls -lh output

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz

