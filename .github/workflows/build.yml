name: syzkaller build

on:
  push:
    branches: [jin-net]
  pull_request:
    branches: [jin-net]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            cpio \
            kmod \
            git \
            rsync \
            dpkg-dev \
            wget \
            xz-utils

      - name: Configure go
        run: |
          set -o pipefail
          {
            wget https://dl.google.com/go/go1.26.0.linux-amd64.tar.gz
            tar -xf go1.26.0.linux-amd64.tar.gz

          } 2>&1 | tee -a mylog.txt

      - name: Make syzkaller
        run: |
          set -o pipefail

          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"

          {
            make install_prerequisites
            make -j$(nproc)
            make bin/syz-extract

          } 2>&1 | tee -a mylog.txt

      - name: Clone Linux 5.15
        run: |
          git clone \
            --depth=1 \
            --branch v6.14 \
            https://github.com/torvalds/linux \
            linux

      - name: Configure kernel
        run: |
          cd linux
          make defconfig
          make prepare

      - name: Generate file const
        run: |
          set -o pipefail
          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"
          {
            ./bin/syz-extract -os linux -arch amd64 \
                -sourcedir linux || true

            echo "menghasilkan sys/linux/vnet_myproto_amd64.const"

          } 2>&1 | tee -a mylog.txt

      - name: Generate
        run: |
          set -o pipefail
          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"
          {
            echo "jin generet"
            ./bin/syz-sysgen || true

          } 2>&1 | tee -a mylog.txt


      - name: Rebuild syzkaller
        run: |
          set -o pipefail
          export GOROOT="$GITHUB_WORKSPACE/go"
          export PATH="$GOROOT/bin:$PATH"
          {
            make -j$(nproc) || true

          } 2>&1 | tee -a mylog.txt




      - name: Collect artifacts
        run: |
          mkdir -p output

          cp mylog.txt output/

          #cp -R ./bin output/ 2>/dev/null || true
          #cp -R ./sys output/ 2>/dev/null || true

          echo "=== Artifact contents ==="
          ls -lh output

          tar czvf result.tar.gz \
            -C output .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.tar.gz

